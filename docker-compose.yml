version: '3.8'

services:
  # 1. Database MySQL (Changed from PostgreSQL to match existing codebase)
  db:
    image: mysql:8.0
    container_name: coffee_db_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coffee_shop
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. Backend API
  backend:
    build: ./coffee-shop-backend
    container_name: coffee_backend_container
    ports:
      - "3000:3000"
    environment:
      # Connect to 'db' service using root user and password
      DATABASE_URL: "mysql://root:root@db:3306/coffee_shop"
      PORT: 3000
      # Placeholders - PLEASE UPDATE WITH REAL VALUES BEFORE PRODUCTION
      JWT_SECRET: "your-secret-key-here"
      CLOUDINARY_CLOUD_NAME: "de3xi5epb"
      CLOUDINARY_API_KEY: "485622184342132"
      CLOUDINARY_API_SECRET: "ZVPS96VkWDUKzv5TKsoMCLA4Ilo"
      # Bank Config
      BANK_ID: "MB"
      BANK_ACCOUNT_NO: "0352526378"
      BANK_TEMPLATE: "compact"
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend React
  frontend:
    build: ./coffee-shop-frontend
    container_name: coffee_frontend_container
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
